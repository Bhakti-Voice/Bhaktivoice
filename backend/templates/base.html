<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Bhakti Voice Admin{% endblock %}</title>
    <style>
      :root {
        --ink: #2b2118;
        --muted: #6b5c4e;
        --line: #eadfce;
        --cream: #f7f0e6;
        --ivory: #fbf6ee;
        --saffron: #c45c26;
        --navy: #1c2b4a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--ivory);
        color: var(--ink);
      }
      a { color: var(--saffron); text-decoration: none; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--line);
        background: white;
      }
      header strong { font-size: 1.15rem; }
      main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1.25rem;
      }
      .grid { display: grid; gap: 0.85rem; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .btn {
        display: inline-flex;
        align-items: center;
        border: 0;
        border-radius: 999px;
        padding: 0.55rem 1rem;
        background: var(--saffron);
        color: white;
        font: inherit;
        cursor: pointer;
      }
      .btn.secondary { background: var(--navy); }
      .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .btn.danger { background: #8f2d2d; }
      label { display: block; margin-top: 0.9rem; font-size: 0.92rem; color: var(--muted); }
      input, textarea, select {
        width: 100%;
        margin-top: 0.3rem;
        padding: 0.7rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--ivory);
        font: inherit;
        color: var(--ink);
      }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 0.7rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
      .notice { background: #eef6ea; color: #215c2a; padding: 0.7rem 1rem; border-radius: 12px; }
      .error { background: #fdecec; color: #8f2d2d; padding: 0.7rem 1rem; border-radius: 12px; }
      .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
      .muted { color: var(--muted); }
      .count { font-size: 1.8rem; margin: 0.3rem 0 0; }
      .thumb {
        width: 72px;
        height: 54px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--cream);
        border: 1px solid var(--line);
        display: block;
      }
      .thumb.empty {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.68rem;
        color: var(--muted);
        text-align: center;
        padding: 0.2rem;
      }
      .thumb-lg {
        max-width: 240px;
        max-height: 150px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--cream);
        display: block;
      }
      .image-url { display: flex; gap: 0.55rem; align-items: center; flex-wrap: wrap; min-width: 18rem; }
      .image-url input[name="heroImage"] {
        width: 16rem;
        margin: 0;
        padding: 0.45rem 0.65rem;
        font-size: 0.8rem;
      }
      .image-url.youtube-embed {
        align-items: flex-start;
        min-width: 16rem;
      }
      .image-url textarea[name="youtubeUrl"] {
        width: 16rem;
        min-height: 4.6rem;
        margin: 0;
        padding: 0.45rem 0.65rem;
        font-size: 0.72rem;
        font-family: ui-monospace, Consolas, monospace;
        line-height: 1.35;
      }
      .image-url .btn { padding: 0.4rem 0.85rem; font-size: 0.85rem; }
      .notice { background: #eef6ea; color: #215c2a; padding: 0.7rem 1rem; border-radius: 12px; }
      .error { background: #fdecec; color: #8f2d2d; padding: 0.7rem 1rem; border-radius: 12px; }
      .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
      .muted { color: var(--muted); }
      .count { font-size: 1.8rem; margin: 0.3rem 0 0; }
      textarea.json, pre {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      pre {
        margin: 0.6rem 0 0;
        padding: 0.85rem;
        background: var(--ivory);
        border-radius: 12px;
        border: 1px solid var(--line);
        overflow: auto;
      }
      /* Rich Editor Toolbar & Preview */
      .editor-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
        margin-top: 0.45rem;
        margin-bottom: 0.25rem;
        padding: 0.35rem 0.5rem;
        background: #fbf7f0;
        border: 1px solid var(--line);
        border-bottom: none;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .editor-toolbar-btn {
        background: white;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.25rem 0.55rem;
        font-size: 0.76rem;
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 500;
        color: var(--ink);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        transition: all 0.15s ease;
      }
      .editor-toolbar-btn:hover {
        background: #f3e9da;
        border-color: #d1ba9e;
        color: var(--saffron);
      }
      .editor-toolbar-btn.accent {
        background: #fff5eb;
        border-color: #f3c299;
        color: var(--saffron);
        font-weight: 600;
      }
      .editor-toolbar-btn.preview-toggle {
        margin-left: auto;
        background: #f4ede2;
        font-weight: 600;
      }
      .editor-toolbar-btn.preview-toggle.active {
        background: var(--saffron);
        color: white;
        border-color: var(--saffron);
      }
      .editor-preview-pane {
        display: none;
        width: 100%;
        min-height: 180px;
        margin-top: 0;
        padding: 1rem 1.25rem;
        border: 1px solid var(--line);
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
        background: white;
        color: var(--ink);
        font-family: Georgia, serif;
        font-size: 0.95rem;
        line-height: 1.6;
        overflow-x: auto;
      }
      .editor-preview-pane.active {
        display: block;
      }
      .editor-preview-pane table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.9rem;
      }
      .editor-preview-pane th {
        background: #f8efe4;
        color: #873812;
        font-weight: bold;
        padding: 0.6rem 0.8rem;
        border: 1px solid var(--line);
      }
      .editor-preview-pane td {
        padding: 0.55rem 0.8rem;
        border: 1px solid var(--line);
      }
      .editor-preview-pane tbody tr:nth-child(even) {
        background: #faf6ef;
      }
      .editor-preview-pane mark {
        background: rgba(230, 126, 34, 0.15);
        color: #923a0e;
        padding: 0.1rem 0.3rem;
        border-radius: 3px;
      }
      .editor-preview-pane blockquote {
        margin: 1rem 0;
        padding: 0.6rem 1rem;
        background: #fcf9f2;
        border-left: 4px solid var(--saffron);
        font-style: italic;
      }
      .has-toolbar-textarea {
        margin-top: 0 !important;
        border-top-left-radius: 0 !important;
        border-top-right-radius: 0 !important;
      }
    </style>
  </head>
  <body>
    {% if admin %}
    <header>
      <a href="/admin"><strong>Bhakti Voice Admin</strong></a>
      <div class="row">
        <a class="btn ghost" href="/admin/json">JSON</a>
        <form method="post" action="/admin/logout">
          <button class="btn ghost" type="submit">Sign out</button>
        </form>
      </div>
    </header>
    {% endif %}
    <main>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
      {% block content %}{% endblock %}
    </main>
    <script>
      function youtubeVideoId(text) {
        const value = String(text || "").trim();
        if (!value) return "";
        const path = value.match(/(?:youtube(?:-nocookie)?\.com\/(?:embed|shorts|live)\/|youtu\.be\/)([A-Za-z0-9_-]{11})/);
        if (path && path[1]) return path[1];
        const query = value.match(/[?&]v=([A-Za-z0-9_-]{11})/);
        if (query && query[1]) return query[1];
        if (/^[A-Za-z0-9_-]{11}$/.test(value)) return value;
        return "";
      }
      function syncYoutubePreview(field) {
        const id = youtubeVideoId(field.value);
        let thumb = field.parentElement.querySelector("[data-youtube-thumb]");
        if (!id) {
          if (thumb) thumb.remove();
          return;
        }
        if (!thumb) {
          thumb = document.createElement("img");
          thumb.className = field.closest("form.image-url") ? "thumb" : "thumb-lg";
          thumb.setAttribute("data-youtube-thumb", "");
          thumb.alt = "YouTube preview";
          field.insertAdjacentElement("beforebegin", thumb);
        }
        thumb.src = "https://img.youtube.com/vi/" + id + "/mqdefault.jpg";
      }
      document.querySelectorAll('textarea[name="youtubeUrl"], input[name="youtubeUrl"]').forEach((field) => {
        syncYoutubePreview(field);
        field.addEventListener("input", () => syncYoutubePreview(field));
      });
    </script>
  </body>
</html>
